# main に push すると、検査してからサイトを組み立てて GitHub Pages に置く
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Python の検査
        # 画面の通しの検査（test_e2e）と実物の写真の検査は、写真がリポジトリに無いので自動で飛ばされる
        run: uv run --frozen pytest -q
      - name: サイトを組み立てる
        run: uv run --frozen python tools/build_site.py site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
